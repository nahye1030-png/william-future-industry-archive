<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>윌리엄 미래산업 기업 아카이브</title><style>
:root{--bg:#08111f;--p:#111b2e;--line:#263651;--txt:#eef4ff;--m:#96a9c6;--a:#7dd3fc;--g:#a7f3d0}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#07101d,#0a1221);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}.w{max-width:1180px;margin:auto;padding:18px}h1{font-size:26px;margin:4px 0}.sub{color:var(--m);font-size:13px;margin-bottom:16px}.search{position:sticky;top:0;z-index:5;background:rgba(8,17,31,.96);padding:10px 0}input{width:100%;font-size:18px;padding:15px 16px;border-radius:14px;border:1px solid #42638d;background:#0c1728;color:white;outline:none}.meta{font-size:12px;color:var(--m);margin:8px 2px 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:var(--p);border:1px solid var(--line);border-radius:15px;padding:14px;cursor:pointer}.top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.t{font-weight:900;font-size:19px;color:var(--a)}.n{font-weight:800}.ko{font-size:12px;color:var(--m)}.cat{font-size:11px;color:#c8e8ff;margin-top:8px}.role{font-size:12px;line-height:1.5;color:#d8e4f7;margin-top:8px}.empty{padding:40px;text-align:center;color:var(--m)}.overlay{display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.62)}.overlay.on{display:block}.sheet{position:absolute;right:0;top:0;height:100%;width:min(760px,100%);overflow:auto;background:#0b1425;padding:18px}.x{position:sticky;top:0;float:right;border:1px solid var(--line);background:#15223a;color:white;border-radius:10px;padding:9px 12px}.head{font-size:28px;font-weight:900;color:var(--a)}.name{font-size:18px;font-weight:800;margin:2px 0 14px}.sec{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0}.sec h3{font-size:13px;color:#bfe3ff;margin:0 0 8px}.kv{display:grid;grid-template-columns:150px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid #1c2a42;font-size:12px}.kv:last-child{border:0}.kv b{color:#8fa7c7}.hist{margin:8px 0;padding:10px;background:#0d1729;border-radius:10px}.hist b{color:var(--g);font-size:12px}.hist div{font-size:12px;line-height:1.45;margin-top:4px}.pill{display:inline-block;border:1px solid #34506f;border-radius:999px;padding:3px 7px;font-size:10px;margin:2px 4px 2px 0;color:#cde8ff}.browse{margin:8px 0 14px}.browseBtn{border:1px solid #34506f;background:#101d31;color:#dff3ff;border-radius:10px;padding:8px 11px;font-size:12px}.filters{display:none;flex-wrap:wrap;gap:6px;margin-top:9px}.filters.on{display:flex}.fbtn{border:1px solid #2d4563;background:#0d182a;color:#cfe6ff;border-radius:999px;padding:6px 9px;font-size:11px;cursor:pointer}.fbtn.on{background:#153250;border-color:#69b9e8;color:white}.industry{margin-top:8px}@media(max-width:760px){.w{padding:12px}h1{font-size:21px}.grid{grid-template-columns:1fr}.sheet{width:100%}.kv{grid-template-columns:1fr}}
</style></head><body><div class="w"><h1>윌리엄 미래산업 기업 아카이브</h1><div class="sub">미국 상장·ADR 기업 · 티커/기업명 검색 · 기업별 병목·강제지출·대기열·원본 이력</div><div class="search"><input id="q" placeholder="티커 또는 기업명 검색 — 예: NVDA, VRT, Eaton" autocomplete="off"><div class="meta" id="meta">데이터 불러오는 중…</div><div class="browse"><button class="browseBtn" id="browseBtn" type="button">분야로 찾아보기 ▾</button><div class="filters" id="filters"></div></div></div><div id="grid" class="grid"></div></div><div id="ov" class="overlay"><div class="sheet"><button class="x" id="closeBtn" type="button">닫기</button><div id="detail"></div></div></div><script>window.__B='';</script><script src="/n00.js"></script><script src="/n01.js"></script><script src="/n02.js"></script><script src="/n03.js"></script><script src="/n04.js"></script><script src="/n05.js"></script><script src="/n06.js"></script><script src="/n07.js"></script><script src="/n08.js"></script><script src="/n09.js"></script><script src="/n10.js"></script><script src="/n11.js"></script><script src="/n12.js"></script><script>const B=window.__B;let D=[],activeIndustry='전체';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const INDUSTRIES=['전체','AI·반도체','데이터센터','전력망','원전','양자','우주','방산','사이버보안','로봇','바이오·장수','물','핵심광물','광통신·네트워크','금융인프라','결제','에너지','산업장비','소프트웨어'];
const OV={
'RKLB':['우주','방산'],'NOC':['방산','우주'],'LMT':['방산','우주'],'RTX':['방산'],'GD':['방산'],'BA':['방산','우주'],'BWXT':['원전','방산'],'IONQ':['양자'],'RGTI':['양자'],'QBTS':['양자'],'QUBT':['양자'],'KEYS':['양자','AI·반도체','산업장비'],'FORM':['AI·반도체','산업장비'],'NVDA':['AI·반도체','데이터센터'],'AMD':['AI·반도체','데이터센터'],'AVGO':['AI·반도체','광통신·네트워크'],'MRVL':['AI·반도체','광통신·네트워크'],'VRT':['데이터센터','전력망','산업장비'],'ETN':['전력망','데이터센터','산업장비'],'GEV':['전력망','에너지'],'CEG':['원전','에너지'],'CCJ':['원전','에너지'],'LEU':['원전','에너지'],'OKLO':['원전','에너지'],'SMR':['원전','에너지'],'TLN':['에너지','데이터센터'],'VST':['에너지','데이터센터'],'MP':['핵심광물','방산'],'USAR':['핵심광물','방산'],'CRWD':['사이버보안'],'PANW':['사이버보안'],'ZS':['사이버보안'],'OKTA':['사이버보안'],'AKAM':['사이버보안','광통신·네트워크'],'XYL':['물','산업장비'],'VLTO':['물','산업장비'],'AWK':['물'],'BMI':['물','산업장비'],'ECL':['물'],'SPGI':['금융인프라'],'MCO':['금융인프라'],'ICE':['금융인프라'],'CBOE':['금융인프라'],'V':['결제','금융인프라'],'MA':['결제','금융인프라'],'GPN':['결제'],'FI':['결제'],'FISV':['결제'],'PLTR':['소프트웨어','방산'],'PATH':['소프트웨어','로봇'],'ISRG':['로봇','바이오·장수'],'TER':['로봇','AI·반도체'],'ROK':['로봇','산업장비']};
function industryTags(x){let out=new Set(OV[x.t]||[]),z=norm([x.a,x.b,x.c,x.r,x.m,...(x.g||[])].join(' '));const add=(tag,arr)=>{if(arr.some(k=>z.includes(k)))out.add(tag)};add('양자',['양자','quantum']);add('우주',['우주','space','satellite','위성','orbital','rocket']);add('방산',['방산','defense','military','미사일','군사','aerospace']);add('원전',['원전','원자력','nuclear','uranium','haleu']);add('전력망',['전력망','송전','배전','변압','grid','switchgear','전력전자']);add('데이터센터',['데이터센터','data center','cooling','냉각','rack','ups']);add('AI·반도체',['반도체','semiconductor','gpu','hbm','eda','foundry','wafer','packaging','chip']);add('사이버보안',['사이버','security','zero trust','보안','identity','xdr','edr']);add('로봇',['로봇','robot','automation','자동화']);add('바이오·장수',['바이오','biotech','genomic','유전자','진단','longevity','장수','의료','medical']);add('물',['수처리','상수도','water','계량기','펌프']);add('핵심광물',['희토류','광물','rare earth','lithium','구리','copper','magnet','영구자석']);add('광통신·네트워크',['광통신','optical','photon','fiber','network','ethernet','cpo']);add('금융인프라',['거래소','clearing','index','rating','custody','exchange','금융인프라']);add('결제',['결제','payment','merchant','card network']);add('에너지',['발전','power generation','utility','천연가스','gas','lng','solar','battery','ess','energy']);add('산업장비',['장비','equipment','industrial','pump','valve','connector','sensor','instrument']);add('소프트웨어',['software','소프트웨어','saas','platform']);if(!out.size)out.add('산업장비');return [...out]}
async function load(){let bin=Uint8Array.from(atob(B),c=>c.charCodeAt(0));let ds=new DecompressionStream('gzip');let txt=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();D=JSON.parse(txt);drawFilters();render()}
function norm(v){return String(v||'').toLowerCase()}
function drawFilters(){$('#filters').innerHTML=INDUSTRIES.map(i=>`<button class="fbtn${i===activeIndustry?' on':''}" data-industry="${esc(i)}" type="button">${esc(i)}</button>`).join('')}
function render(){let q=norm($('#q').value).trim();let R=D.filter(x=>(activeIndustry==='전체'||industryTags(x).includes(activeIndustry))&&(!q||norm([x.t,x.n,x.k,x.a,x.b,x.c,x.r,...(x.g||[]),...industryTags(x)].join(' ')).includes(q)));$('#meta').textContent=R.length.toLocaleString()+'개 표시 / 전체 '+D.length.toLocaleString()+'개'+(activeIndustry!=='전체'?' · '+activeIndustry:'');$('#grid').innerHTML=R.map(x=>`<article class="card" data-ticker="${esc(x.t)}" role="button" tabindex="0"><div class="top"><span class="t">${esc(x.t)}</span><span class="n">${esc(x.n)}</span></div>${x.k?`<div class="ko">${esc(x.k)}</div>`:''}<div class="industry">${industryTags(x).slice(0,4).map(v=>`<span class="pill">${esc(v)}</span>`).join('')}</div><div class="cat">원문 분류 · ${esc([x.a,x.b,x.c].filter(Boolean).join(' › '))}</div><div class="role">${esc(x.r||'상세 역할 미기록')}</div></article>`).join('')||'<div class="empty">검색 결과가 없습니다.</div>'}
function row(k,v){return v?`<div class="kv"><b>${esc(k)}</b><span>${esc(v)}</span></div>`:''}
function openD(t){let x=D.find(z=>z.t===t);if(!x)return;let hist=x.h||[],tags=industryTags(x);$('#detail').innerHTML=`<div class="head">${esc(x.t)}</div><div class="name">${esc(x.n)} ${x.k?`<span class="ko">· ${esc(x.k)}</span>`:''}</div><div class="sec"><h3>통상 산업분류</h3><div>${tags.map(v=>`<span class="pill">${esc(v)}</span>`).join('')}</div></div><div class="sec"><h3>기업 기본정보</h3>${row('상장구분',x.l)}${row('원문 대분류',x.a)}${row('원문 중분류',x.b)}${row('원문 소분류',x.c)}${row('관련 산업/역할',x.r)}${row('자금 흐름',x.m)}</div><div class="sec"><h3>강제지출 · 병목 구조</h3>${row('① 부족해지는 것',x.f?.[0])}${row('② 참을 수 있는가',x.f?.[1])}${row('③ 지출 주체',x.f?.[2])}${row('④ 반드시 지나가는 구조',x.f?.[3])}${row('⑤ CAPEX→FCF',x.f?.[4])}${row('⑥ 공급탄력성',x.f?.[5])}${row('⑦ Queue Ownership',x.q)}${row('지출 성격',x.s)}</div><div class="sec"><h3>원본 등장 이력 · ${x.ac||hist.length}회</h3><div>${(x.g||[]).map(g=>`<span class="pill">${esc(g)}</span>`).join('')}</div>${hist.map(h=>`<div class="hist"><b>${esc(h.group||h.source||'원본')}</b><div>${esc(h.reason||h.role||[h.major,h.middle,h.minor].filter(Boolean).join(' › ')||'등장 이유 미기록')}</div>${h.sheet?`<div class="ko">${esc(h.sheet)}</div>`:''}</div>`).join('')}</div>`;$('#ov').classList.add('on');document.body.style.overflow='hidden'}
function closeD(){$('#ov').classList.remove('on');document.body.style.overflow=''}
$('#q').addEventListener('input',render);$('#browseBtn').addEventListener('click',()=>{$('#filters').classList.toggle('on');$('#browseBtn').textContent=$('#filters').classList.contains('on')?'분야로 찾아보기 ▴':'분야로 찾아보기 ▾'});$('#filters').addEventListener('click',e=>{let b=e.target.closest('.fbtn');if(!b)return;activeIndustry=b.dataset.industry;drawFilters();render()});$('#grid').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)openD(c.dataset.ticker)});$('#grid').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.closest('.card')){e.preventDefault();openD(e.target.closest('.card').dataset.ticker)}});$('#closeBtn').addEventListener('click',closeD);$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeD()});load().catch(e=>{$('#meta').textContent='데이터 로딩 오류';console.error(e)});
</script></body></html>
