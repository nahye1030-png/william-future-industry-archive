<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>윌리엄 미래산업 기업 아카이브</title><style>
:root{--bg:#08111f;--p:#111b2e;--line:#263651;--txt:#eef4ff;--m:#96a9c6;--a:#7dd3fc;--g:#a7f3d0}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#07101d,#0a1221);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}.w{max-width:1180px;margin:auto;padding:18px}h1{font-size:26px;margin:4px 0}.sub{color:var(--m);font-size:13px;margin-bottom:16px}.search{position:sticky;top:0;z-index:5;background:rgba(8,17,31,.96);padding:10px 0}input{width:100%;font-size:18px;padding:15px 16px;border-radius:14px;border:1px solid #42638d;background:#0c1728;color:white;outline:none}.meta{font-size:12px;color:var(--m);margin:8px 2px 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:var(--p);border:1px solid var(--line);border-radius:15px;padding:14px;cursor:pointer}.top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.t{font-weight:900;font-size:19px;color:var(--a)}.n{font-weight:800}.ko{font-size:12px;color:var(--m)}.cat{font-size:11px;color:#c8e8ff;margin-top:8px}.role{font-size:12px;line-height:1.5;color:#d8e4f7;margin-top:8px}.empty{padding:40px;text-align:center;color:var(--m)}.overlay{display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.62)}.overlay.on{display:block}.sheet{position:absolute;right:0;top:0;height:100%;width:min(760px,100%);overflow:auto;background:#0b1425;padding:18px}.x{position:sticky;top:0;float:right;border:1px solid var(--line);background:#15223a;color:white;border-radius:10px;padding:9px 12px}.head{font-size:28px;font-weight:900;color:var(--a)}.name{font-size:18px;font-weight:800;margin:2px 0 14px}.sec{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0}.sec h3{font-size:13px;color:#bfe3ff;margin:0 0 8px}.kv{display:grid;grid-template-columns:150px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid #1c2a42;font-size:12px}.kv:last-child{border:0}.kv b{color:#8fa7c7}.hist{margin:8px 0;padding:10px;background:#0d1729;border-radius:10px}.hist b{color:var(--g);font-size:12px}.hist div{font-size:12px;line-height:1.45;margin-top:4px}.pill{display:inline-block;border:1px solid #34506f;border-radius:999px;padding:3px 7px;font-size:10px;margin:2px 4px 2px 0;color:#cde8ff}@media(max-width:760px){.w{padding:12px}h1{font-size:21px}.grid{grid-template-columns:1fr}.sheet{width:100%}.kv{grid-template-columns:1fr}}
</style></head><body><div class="w"><h1>윌리엄 미래산업 기업 아카이브</h1><div class="sub">미국 상장·ADR 기업 · 티커/기업명 검색 · 기업별 병목·강제지출·대기열·원본 이력</div><div class="search"><input id="q" placeholder="티커 또는 기업명 검색 — 예: NVDA, VRT, Eaton" autocomplete="off"><div class="meta" id="meta">데이터 불러오는 중…</div></div><div id="grid" class="grid"></div></div><div id="ov" class="overlay"><div class="sheet"><button class="x" id="closeBtn" type="button">닫기</button><div id="detail"></div></div></div><script>window.__B='';</script><script src="/n00.js"></script><script src="/n01.js"></script><script src="/n02.js"></script><script src="/n03.js"></script><script src="/n04.js"></script><script src="/n05.js"></script><script src="/n06.js"></script><script src="/n07.js"></script><script src="/n08.js"></script><script src="/n09.js"></script><script src="/n10.js"></script><script src="/n11.js"></script><script src="/n12.js"></script><script>const B=window.__B;let D=[];const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){let bin=Uint8Array.from(atob(B),c=>c.charCodeAt(0));let ds=new DecompressionStream('gzip');let txt=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();D=JSON.parse(txt);render()}function norm(v){return String(v||'').toLowerCase()}function render(){let q=norm($('#q').value).trim();let R=D.filter(x=>!q||norm([x.t,x.n,x.k,x.a,x.b,x.c,x.r,...(x.g||[])].join(' ')).includes(q));$('#meta').textContent=R.length.toLocaleString()+'개 표시 / 전체 '+D.length.toLocaleString()+'개';$('#grid').innerHTML=R.map(x=>`<article class="card" data-ticker="${esc(x.t)}" role="button" tabindex="0"><div class="top"><span class="t">${esc(x.t)}</span><span class="n">${esc(x.n)}</span></div>${x.k?`<div class="ko">${esc(x.k)}</div>`:''}<div class="cat">${esc([x.a,x.b,x.c].filter(Boolean).join(' › '))}</div><div class="role">${esc(x.r||'상세 역할 미기록')}</div></article>`).join('')||'<div class="empty">검색 결과가 없습니다.</div>'}function row(k,v){return v?`<div class="kv"><b>${esc(k)}</b><span>${esc(v)}</span></div>`:''}function openD(t){let x=D.find(z=>z.t===t);if(!x)return;let hist=x.h||[];$('#detail').innerHTML=`<div class="head">${esc(x.t)}</div><div class="name">${esc(x.n)} ${x.k?`<span class="ko">· ${esc(x.k)}</span>`:''}</div><div class="sec"><h3>기업 기본정보</h3>${row('상장구분',x.l)}${row('대분류',x.a)}${row('중분류',x.b)}${row('소분류',x.c)}${row('관련 산업/역할',x.r)}${row('자금 흐름',x.m)}</div><div class="sec"><h3>강제지출 · 병목 구조</h3>${row('① 부족해지는 것',x.f?.[0])}${row('② 참을 수 있는가',x.f?.[1])}${row('③ 지출 주체',x.f?.[2])}${row('④ 반드시 지나가는 구조',x.f?.[3])}${row('⑤ CAPEX→FCF',x.f?.[4])}${row('⑥ 공급탄력성',x.f?.[5])}${row('⑦ Queue Ownership',x.q)}${row('지출 성격',x.s)}</div><div class="sec"><h3>원본 등장 이력 · ${x.ac||hist.length}회</h3><div>${(x.g||[]).map(g=>`<span class="pill">${esc(g)}</span>`).join('')}</div>${hist.map(h=>`<div class="hist"><b>${esc(h.group||h.source||'원본')}</b><div>${esc(h.reason||h.role||[h.major,h.middle,h.minor].filter(Boolean).join(' › ')||'등장 이유 미기록')}</div>${h.sheet?`<div class="ko">${esc(h.sheet)}</div>`:''}</div>`).join('')}</div>`;$('#ov').classList.add('on');document.body.style.overflow='hidden'}function closeD(){$('#ov').classList.remove('on');document.body.style.overflow=''}$('#q').addEventListener('input',render);$('#grid').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)openD(c.dataset.ticker)});$('#grid').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.closest('.card')){e.preventDefault();openD(e.target.closest('.card').dataset.ticker)}});$('#closeBtn').addEventListener('click',closeD);$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeD()});load().catch(e=>{$('#meta').textContent='데이터 로딩 오류';console.error(e)});
</script></body></html>
